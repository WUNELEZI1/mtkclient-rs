[source.crates-io]
replace-with = 'ustc'
 
[source.ustc]
registry = "sparse+https://mirrors.ustc.edu.cn/crates.io-index/"
 
[registries.ustc]
index = "sparse+https://mirrors.ustc.edu.cn/crates.io-index/"
 
[http]
check-revoke = false

# Strip source paths from release builds to avoid leaking the build environment.
[target.x86_64-pc-windows-msvc]
rustflags = [
    "--remap-path-prefix=C:\\Users\\wqy=",
    "--remap-path-prefix=D:\\test\\ZybClient=",
    "--remap-path-prefix=/workspace/repo=",
    "--remap-path-prefix=/usr/local/cargo=",
    "--remap-path-prefix=/root/.cargo=",
]

# Same for the GNU toolchain; the last two entries also hide cargo registry paths
# that third-party crates embed through file!().
[target.x86_64-pc-windows-gnu]
rustflags = [
    "--remap-path-prefix=C:\\Users\\wqy=",
    "--remap-path-prefix=D:\\test\\ZybClient=",
    "--remap-path-prefix=/workspace/repo=",
    "--remap-path-prefix=/usr/local/cargo=",
    "--remap-path-prefix=/root/.cargo=",
]
# Same path stripping for the 32-bit (i686) target.
[target.i686-pc-windows-msvc]
rustflags = [
    "--remap-path-prefix=C:\\Users\\wqy=",
    "--remap-path-prefix=D:\\test\\ZybClient=",
    "--remap-path-prefix=/workspace/repo=",
    "--remap-path-prefix=/usr/local/cargo=",
    "--remap-path-prefix=/root/.cargo=",
]
