[package]
name = "mtkclient-rs"
version = "0.1.7"
authors = ["wunelezi <https://github.com/WUNELEZI1>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/WUNELEZI1/mtkclient-rs"
edition = "2024"

[lints.rust]
non_snake_case = "allow"

[features]
# Enable automatic WinUSB driver installation by default.
default = ["winusb-driver"]
# Automatic WinUSB driver installation. When disabled the Windows target still builds,
# but `switch_to_winusb` becomes a stub; useful for cross-compilation or CI without libwdi.
winusb-driver = ["dep:wdi-rs"]

[dependencies]
# Logging facade; formatter and module filter are custom, `std` provides set_boxed_logger.
log = { version = "0.4", features = ["std"] }
# CLI parsing with trimmed default features (std + derive + help only).
clap = { version = "4", default-features = false, features = ["std", "derive", "help"] }
# Serial transport. Default features are off to avoid the Linux-only libudev dependency.
serialport = { version = "4.7", default-features = false }
# Crypto primitives (SHA-256 is implemented in src/sha.rs).
aes = "0.9"
cbc = "0.2"
# ramdisk decompression: gzip (flate2, pure Rust) and xz (lzma_rs); lz4 is built in.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
lzma-rs = "0.3"
# USB transport: pure-Rust nusb with the WinUSB backend; synchronous I/O only.
nusb = { version = "0.2.5", default-features = false }
# Progress bar (custom implementation, see src/progress.rs).

# Windows-only dependencies. wdi-rs refuses to compile on other platforms.
[target.'cfg(windows)'.dependencies]
# WinUSB driver installation, enabled by the `winusb-driver` feature.
wdi-rs = { version = "0.1.1", optional = true }

[profile.dev]
# dev: fastest compilation, no optimization.
opt-level = 0
debug = true
incremental = true
codegen-units = 256
lto = false

[profile.fast]
# fast: balanced compile time and runtime performance.
inherits = "dev"
opt-level = 2
codegen-units = 16
lto = "thin"

[profile.release]
# release: maximum runtime performance, no debug symbols.
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"
panic = "abort"
overflow-checks = false
incremental = false
