[package]
name = "mtkclient-rs"
version = "0.1.7"
authors = ["wunelezi <https://gitee.com/WUNELEZI1>"]
license = "Apache-2.0"
edition = "2024"

[lints.rust]
non_snake_case = "allow"

[features]
# 默认启用 Windows 驱动自动安装（WinUSB / libwdi），保持与以往一致的完整功能。
default = ["winusb-driver"]
# WinUSB 驱动自动安装。关闭后仍可构建 Windows 目标，但 `switch_to_winusb` 退化为
# 占位实现——适用于没有 libwdi 原生工具链的交叉编译/CI 环境（wdi-rs 的 build.rs
# 仅在 Windows 主机上才会输出 libwdi 链接路径，且 libwdi 为 MSVC 静态库）。
winusb-driver = ["dep:wdi-rs"]

[dependencies]
# 日志（log 仅作 Log trait 来源；格式器与按模块过滤均为自研；std 特性提供 set_boxed_logger）
log = { version = "0.4", features = ["std"] }
# 命令行参数解析（裁剪默认特性：仅保留 std + derive + help，去除 color/suggestions/error-context/unicode/env/wrap_help 以减体积）
clap = { version = "4", default-features = false, features = ["std", "derive", "help"] }
# 串口通信（显式关闭默认特性：唯一默认特性 libudev 为 linux-only，不进 Windows 二进制；
# Windows 后端依赖 windows-sys 无条件编译，无 feature 可裁。此处锁定不依赖 libudev，
# 防止上游未来给 serialport 加默认特性。vid/pid 字段无需 usbportinfo-interface 特性）
serialport = { version = "4.7", default-features = false }
# 加密算法（sha256 已自研，见 src/sha.rs）
aes = "0.9"
cbc = "0.2"
# USB 通信（nusb: 纯 Rust USB 库，Windows WinUSB 后端；仅用同步 I/O，
# 显式关闭默认特性以锁定不启用 smol/tokio 异步运行时，保持纯同步、最小体积）
nusb = { version = "0.2.5", default-features = false }
# 进度条显示（自研，见 src/progress.rs）

# Windows 专属依赖：仅当 target 为 windows 时编译。
# wdi-rs 内部 `compile_error!("This crate only supports Windows")`，
# 若作为无条件依赖会导致 Linux/macOS 上无法编译（进而无法跑 `cargo test`）。
[target.'cfg(windows)'.dependencies]
# Windows 驱动自动安装（WinUSB）；由 `winusb-driver` 特性启用（默认开启）
wdi-rs = { version = "0.1.1", optional = true }

[profile.dev]
# 开发模式：编译最快，不优化，保留完整调试信息
opt-level = 0
debug = true
incremental = true
codegen-units = 256
lto = false

[profile.fast]
# 快速优化模式：平衡编译速度和运行时性能（推荐日常测试使用）
# 比 dev 快 2-5 倍，比 release 编译快 10 倍以上
inherits = "dev"
opt-level = 2
codegen-units = 16
lto = "thin"

[profile.release]
# 发布模式：运行时性能最强优先，编译速度不计；无调试符号
# opt-level=3 最高速度优化；lto=fat 全程序内联；codegen-units=1 最大跨单元优化；
# debug=false+strip=symbols 去除调试信息与符号表；panic=abort 去掉 unwind 表；
# overflow-checks=false 关闭溢出检查；incremental=false 不缓存增量（配合 fat lto 已无意义）
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"
panic = "abort"
overflow-checks = false
incremental = false
