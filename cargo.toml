[package]
name = "mtkclient-rs"
version = "0.4.5"
authors = ["wunelezi <https://gitee.com/WUNELEZI1>"]
license = "GPL-3.0"
edition = "2024"

# 项目强制要求：中文函数名、变量名、文件名、注释。
# Rust 默认对标识符执行 snake_case 检查会触发大量 non_snake_case 警告，
# 但中文标识符（包括 PID/VID/USB/EMMC/EMI/GPT/DA/IO/SLA/DAA/SBC/BROM 等
# 复合缩略词）都是项目约定必须保留的术语。
# 在 crate 级别统一抑制该 lint，确保编译 0 警告。
[lints.rust]
non_snake_case = "allow"

[dependencies]
# 日志
log = "0.4"
env_logger = "0.11"
# 终端彩色输出
colored = "3.1"
# 命令行参数解析
clap = { version = "4", features = ["derive"] }
# 串口通信
serialport = "4.7"
# 加密算法
sha2 = "0.11"
aes = "0.9"
cbc = "0.2"
# USB 通信（libusb-1.0 FFI 绑定，WinUSB 后端）
libusb1-sys = "0.7"
# Windows 驱动自动安装（WinUSB）
wdi-rs = "0.1.1"
# Windows 管理员权限检测
is_elevated = "0.1"
# 进度条显示
indicatif = "0.18"

[profile.dev]
# 开发模式：编译最快，不优化，保留完整调试信息
opt-level = 0
debug = true
incremental = true
codegen-units = 256
lto = false

[profile.release]
# 发布模式：最佳性能与稳定性
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = true
panic = "abort"
