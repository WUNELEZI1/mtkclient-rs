[package]
name = "mtkclient-rs"
version = "0.1.6"
authors = ["wunelezi <https://gitee.com/WUNELEZI1>"]
license = "Apache-2.0"
edition = "2024"

[lints.rust]
non_snake_case = "allow"

[dependencies]
# 日志
log = "0.4"
env_logger = "0.11"
# 终端彩色输出
colored = "3.1"
# 终端显示宽度（中文双宽表格对齐）
unicode-width = "0.2"
# 命令行参数解析
clap = { version = "4", features = ["derive"] }
# 串口通信
serialport = "4.7"
# 加密算法
sha2 = "0.11"
aes = "0.9"
cbc = "0.2"
# USB 通信（nusb: 纯 Rust USB 库，Windows WinUSB 后端）
nusb = { version = "0.2.5", features = ["tokio"] }
# Windows 驱动自动安装（WinUSB）
wdi-rs = "0.1.1"
# Windows 管理员权限检测
is_elevated = "0.1"
# 进度条显示
indicatif = "0.18"
# Ctrl+C 优雅中断
ctrlc = "3.5"
# SIMD 字节搜索（build.prop 属性提取）
memchr = "2.7"

[profile.dev]
# 开发模式：编译最快，不优化，保留完整调试信息
opt-level = 0
debug = true
incremental = true
codegen-units = 256
lto = false

[profile.fast]
# 快速优化模式：平衡编译速度和运行时性能（推荐日常测试使用）
# 比 dev 快 2-5 倍，比 release 编译快 10 倍以上
inherits = "dev"
opt-level = 2
codegen-units = 16
lto = "thin"

[profile.release]
# 发布模式：最佳性能、稳定性与反逆向工程保护
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"
panic = "abort"
overflow-checks = false
incremental = false
